<!DOCTYPE html>
<html lang="nl">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stijl.css">
</head>
<body>

<header class="kop">
  <a class="terug" href="../Digiplan.html">← Digiplan</a>
  <div class="titel">
    <h1>Leerplandoelen</h1>
    <p>Digitale geletterdheid</p>
  </div>
  <label class="zoek">
    <span class="sr">Zoek in de doelen</span>
    <input type="search" id="zoek" placeholder="Zoek een doel, code of woord" autocomplete="off">
  </label>
  <nav class="verwant" aria-label="Verwante pagina's">
    <a href="../LeerLokaal.html">LeerLokaal</a>
    <a href="../rubrics_digitale_geletterdheid.html">Rubrics</a>
    <a href="../woordenlijst.html">Woordenlijst</a>
  </nav>
  <button class="beheer-knop" id="beheerKnop" type="button" aria-pressed="false">Beheer</button>
</header>

<div class="balk">
  <nav class="tabs" id="tabs" aria-label="Weergave"></nav>
  <div class="lijnen" id="lijnen" role="group" aria-label="Leerlijn"></div>
</div>

<div class="beheer-balk" id="beheerBalk" hidden></div>

<div class="werk">
  <main id="inhoud"></main>
  <aside id="paneel" aria-label="Details" hidden></aside>
</div>

<dialog id="codeDialoog">

    <h2>Beheer openen</h2>
    <label for="codeVeld">Beheerderscode</label>
    <input id="codeVeld" type="password" autocomplete="off">
    <p class="fout" id="codeFout" role="alert"></p>
    <div class="rij">
      <button type="button" class="knop" id="codeAnnuleer">Annuleren</button>
      <button type="submit" class="knop vol">Openen</button>
    </div>
  </form>
</dialog>
<div class="melding" id="melding" role="status"></div>
<noscript>Deze pagina heeft JavaScript nodig om de leerplandoelen te tonen.</noscript>

<script src="doelen-data.js"></script>
<script src="spiraal-data.js"></script>
<script src="app.js"></script>

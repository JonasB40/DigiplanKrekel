<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LeerLokaal – Digitale Competenties OVSG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=3">
  <link rel="stylesheet" href="digiplan.css?v=5">
  <script src="digiplan.js?v=4" defer></script>
<style>
:root { --accent: #2563a8; --accent-light: #dbeafe; }
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:#1E293B;font-size:15px}
.wrap{margin:22px 0 0;padding:0 var(--dp-marge) 60px}
.app-card{background:white;border-radius:var(--radius);padding:30px 28px;border:1px solid var(--border)}
.header{display:flex;align-items:center;gap:14px;margin-bottom:28px;padding-bottom:20px;border-bottom:2px solid #E2E8F0}
.logo{width:44px;height:44px;background:linear-gradient(135deg,var(--accent),#7C3AED);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.app-title{font-size:20px;font-weight:700;color:#1E293B;font-family:var(--titel)}
.app-sub{font-size:13.5px;color:#5b6b7f;margin-top:2px}
.step-label{font-size:13px;font-weight:700;color:#5b6b7f;margin-bottom:6px}
.section-title{font-family:var(--titel);font-size:1.3rem;font-weight:700;color:#1E293B;margin-bottom:14px}
.ll-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.ll-card{background:var(--dp-tegel);border:1px solid var(--dp-tegel-rand);border-left:6px solid #1f5c9e;border-radius:18px;padding:18px;cursor:pointer;text-align:left;transition:all .18s}
.ll-card:nth-child(2){background:var(--dp-paars);border-color:var(--dp-paars-rand);border-left-color:#6d28d9}
.ll-card:nth-child(3){background:var(--dp-munt);border-color:var(--dp-munt-rand);border-left-color:#04694c}
.ll-card:hover{border-color:#5b6b7f;transform:translateY(-2px)}
.ll-card.sel-ict,.ll-card.sel-comp,.ll-card.sel-media{box-shadow:0 0 0 3px var(--dp-blauw2)}
.ll-icon{font-size:32px;margin-bottom:8px}
.ll-name{font-size:15px;font-weight:800;color:#1E293B;margin-bottom:4px}
.ll-desc{font-size:13px;color:#64748B;line-height:1.5}
.phase-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.phase-btn{background:#fff;border:1px solid #d3dde8;border-radius:16px;padding:10px 18px;cursor:pointer;font-size:14.5px;font-weight:700;color:#1E293B;transition:all .15s;text-align:center}
.phase-btn:hover{border-color:#5b6b7f}
.phase-btn.active{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}
.phase-age{font-size:13px;font-weight:600;color:#5b6b7f;margin-top:2px}
/* Weergave-keuze */
.view-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.view-btn{background:#fff;border:1px solid #d3dde8;border-radius:999px;padding:10px 18px;cursor:pointer;font-size:14.5px;font-weight:700;color:#64748B;transition:all .15s;display:flex;align-items:center;gap:7px}
.view-btn:hover{border-color:#5b6b7f}
.view-btn.active{border-color:var(--dp-blauw2);background:var(--dp-blauw2);color:#fff}
/* Leerjaar-chips */
.jaar-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.jaar-btn{background:#fff;border:1px solid #d3dde8;border-radius:999px;padding:8px 15px;cursor:pointer;font-size:14.5px;font-weight:700;color:#1E293B;transition:all .15s}
.jaar-btn:hover{border-color:#5b6b7f}
.jaar-btn.active{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}
/* Gegroepeerde doelen per leerlijn */
.ll-group{margin-bottom:20px}
.ll-group-header{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin-bottom:8px;padding:7px 12px;border-radius:9px}
/* Fase-badge op doelkaart */
.fase-badge{font-size:13px;font-weight:700;background:#F1F5F9;color:#64748B;padding:2px 9px;border-radius:100px;margin-left:auto;flex-shrink:0;align-self:center}
/* Zoekveld doelen */
.goal-search{width:100%;padding:11px 15px;border:2px solid #E2E8F0;border-radius:12px;font-size:14.5px;font-family:inherit;margin-bottom:16px;background:#fff}
.goal-search:focus{outline:none;border-color:var(--accent)}
.no-results{padding:18px;text-align:center;color:#5b6b7f;font-size:14.5px;display:none}
/* Globale zoekbalk */
.global-search{padding:14px 18px;font-size:15px;border-color:#cbd5e1;box-shadow:0 2px 10px rgba(15,31,48,0.05);margin-bottom:6px}
.global-search:focus{border-color:var(--accent);box-shadow:0 2px 14px rgba(37,99,168,0.15)}
.global-hint{font-size:13px;color:#5b6b7f;margin-bottom:20px}
.tool-badge{font-size:13px;font-weight:700;background:#FEF3C7;color:#92400E;padding:2px 8px;border-radius:100px;flex-shrink:0;align-self:center;white-space:nowrap}
.clear-search-row{display:flex;justify-content:flex-end;margin-bottom:10px}
.goals-list{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.goal-card{background:#fff;border:1px solid #d3dde8;border-radius:12px;padding:12px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:all .15s}
.goal-card:hover{border-color:#5b6b7f}
.goal-card.active{border-color:var(--accent);background:var(--accent-light)}
.goal-row{display:flex;gap:14px;align-items:flex-start;width:100%}
.goal-code{font-size:13px;font-weight:800;color:var(--accent);min-width:76px;padding-top:2px;flex-shrink:0}
.goal-text{font-size:14.5px;color:#1E293B;line-height:1.55;flex:1}
.badge-nieuw{font-size:13px;font-weight:800;background:#FEF3C7;color:#B45309;padding:2px 8px;border-radius:100px;flex-shrink:0;align-self:center}
.goal-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:#5b6b7f;font-weight:600;padding-left:90px;line-height:1.5}
.meta-pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:2.5px 10px;border-radius:100px;white-space:nowrap}
.mp-age{background:#E0F2FE;color:#075985}
.mp-fase{background:#EDE9FE;color:#5B21B6}
.mp-jaar{background:#DCFCE7;color:#166534}
.meta-extra{font-size:13px;color:#5b6b7f;font-weight:600}
.diff-toggle{background:none;border:none;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;padding:0}
.diff-panel{padding:10px 12px;background:#F8FAFC;border:1.5px solid #E2E8F0;border-radius:10px;margin-left:90px}
.diff-line{font-size:13.5px;color:#475569;line-height:1.55;margin-bottom:7px;display:flex;gap:8px;align-items:flex-start}
.diff-line:last-child{margin-bottom:0}
.diff-tag{font-size:13px;font-weight:800;padding:2px 7px;border-radius:100px;flex-shrink:0;margin-top:2px}
.dt-onder{background:#FFF7ED;color:#EA580C}
.dt-verdiep{background:#F5F3FF;color:#7C3AED}
@media(max-width:600px){.goal-meta,.diff-panel{padding-left:0;margin-left:0}}
/* ── TEACHER PROGRESS ── */
.prog-badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:2.5px 9px;border-radius:100px;flex-shrink:0;cursor:pointer;border:1.5px solid currentColor;background:transparent;font-family:inherit;transition:all .15s;white-space:nowrap}
.prog-badge:hover{opacity:.75}
.prog-none{color:#5b6b7f;border-color:#CBD5E1}
.prog-bezig{color:#92400E;background:#FEF9C3;border-color:#FDE047}
.prog-behandeld{color:#166534;background:#DCFCE7;border-color:#4ADE80}
.prog-geval{color:#1e4d96;background:#DBEAFE;border-color:#60A5FA}
.rubric-btn{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:700;padding:2.5px 9px;border-radius:100px;background:#F0F9FF;color:#0369A1;border:1.5px solid #BAE6FD;text-decoration:none;cursor:pointer;flex-shrink:0;white-space:nowrap}
.rubric-btn:hover{background:#BAE6FD}
.prog-summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.prog-stat{display:flex;align-items:center;gap:6px;font-size:14.5px;font-weight:700;color:#1E293B}
.prog-stat-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.prog-empty{padding:40px 0;text-align:center;color:#5b6b7f;font-size:15px;line-height:1.7}
.btn-primary{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 24px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;transition:background .15s}
.btn-primary:hover{background:#1e4276}
.btn-green{background:#047857;color:#fff;border:none;border-radius:10px;padding:12px 24px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.btn-green:hover{background:#047857}
.btn-ghost{background:transparent;color:#64748B;border:2px solid #E2E8F0;border-radius:10px;padding:11px 22px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-ghost:hover{background:#F8FAFC}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.crumb{font-size:13.5px;color:#64748B;margin-bottom:18px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crumb-link{color:#64748B;cursor:pointer;text-decoration:underline}
.crumb-link:hover{color:var(--accent)}
.crumb-sep{color:#CBD5E1}
.spinner{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 0;gap:14px}
.spin-ring{width:44px;height:44px;border:4px solid #E2E8F0;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-msg{font-size:15px;font-weight:700;color:#475569}
.spin-sub{font-size:13.5px;color:#5b6b7f}
.err-box{background:#FFF1F2;border:1.5px solid #FECDD3;border-radius:10px;padding:12px 16px;color:#BE123C;font-size:14.5px;margin-bottom:14px}
.lib-section{margin-bottom:6px}
.lib-label{font-size:13px;font-weight:700;color:#5b6b7f;margin-bottom:8px}
.lib-ideas{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.lib-idea{background:#fff;border:1.5px solid #E2E8F0;border-radius:10px;padding:11px 16px;cursor:pointer;font-size:14.5px;color:#1E293B;transition:all .15s;font-weight:600}
.lib-idea:hover{border-color:#5b6b7f}
.lib-idea.selected{border-color:var(--accent);background:var(--accent-light);color:#1e4276}
.ai-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.ai-card{background:#fff;border:1.5px solid #E2E8F0;border-radius:12px;padding:14px;cursor:pointer;transition:all .15s}
.ai-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.ai-num{font-size:13px;color:#5b6b7f;margin-bottom:6px;font-weight:700}
.ai-title{font-size:15px;font-weight:800;color:#1E293B;margin-bottom:6px}
.ai-desc{font-size:13.5px;color:#64748B;line-height:1.55}
.ai-arrow{margin-top:10px;font-size:16px;color:var(--accent)}
.info-box{background:#F0F9FF;border:1.5px solid #BAE6FD;border-radius:10px;padding:10px 14px;font-size:13.5px;color:#0369A1;margin-bottom:16px;line-height:1.5}
/* FICHE */
.fiche-header{background:#fff;border:2px solid #E2E8F0;border-radius:14px;padding:22px 24px;margin-bottom:14px}
.fiche-age-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:100px;margin-bottom:10px}
.fiche-title-main{font-family:var(--titel);font-size:1.5rem;font-weight:700;color:#1E293B;margin-bottom:4px}
.fiche-subtitle{font-size:14.5px;color:#64748B;font-weight:600;margin-bottom:12px}
.fiche-meta{display:flex;gap:18px;flex-wrap:wrap}
.fiche-meta span{font-size:13.5px;color:#64748B;font-weight:600}
.tabs{display:flex;background:#fff;border-radius:12px;padding:5px;border:2px solid #E2E8F0;margin-bottom:16px;gap:4px}
.tab-btn{flex:1;padding:10px 6px;border:none;border-radius:8px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;background:transparent;color:#64748B;transition:all .15s}
.tab-btn.active{background:var(--accent);color:#fff}
.card{background:#fff;border:2px solid #E2E8F0;border-radius:14px;padding:18px 20px;margin-bottom:12px}
.card-title{font-size:15px;font-weight:800;color:#1E293B;margin-bottom:12px}
.goal-banner{background:#F0FDF4;border-left:4px solid #10B981;border-radius:0 10px 10px 0;padding:12px 16px;font-size:15px;font-weight:700;color:#1E293B;margin-bottom:10px}
.subdoel{display:flex;gap:8px;margin-bottom:7px;font-size:14.5px;color:#475569;line-height:1.5}
.dot{width:7px;height:7px;border-radius:50%;background:#10B981;margin-top:5px;flex-shrink:0}
.tag{display:inline-block;background:var(--accent-light);color:var(--accent);font-size:13px;padding:4px 10px;border-radius:100px;margin:3px 3px 3px 0;font-weight:700}
.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.diff-easy{background:#FFF7ED;border:1.5px solid #FED7AA;border-radius:10px;padding:14px}
.diff-hard{background:#F5F3FF;border:1.5px solid #DDD6FE;border-radius:10px;padding:14px}
.diff-label{font-size:13px;font-weight:800;margin-bottom:6px}
.diff-easy .diff-label{color:#EA580C}
.diff-hard .diff-label{color:#7C3AED}
.diff-text{font-size:14.5px;color:#1E293B;line-height:1.55}
.opwarmer{background:#FFFBEB;border:1.5px solid #FDE68A;border-radius:10px;padding:14px;margin-bottom:18px}
.opwarmer-label{font-size:13px;font-weight:800;color:#b45309;margin-bottom:6px;}
.opwarmer-text{font-size:14.5px;color:#1E293B;line-height:1.6}
.step-row{display:flex;gap:16px;margin-bottom:20px}
.step-line{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.step-num{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14.5px;font-weight:800}
.step-connector{width:2px;background:#E2E8F0;flex:1;margin-top:6px;min-height:20px}
.step-body{flex:1;padding-bottom:4px}
.step-title-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.step-title{font-size:15px;font-weight:800;color:#1E293B}
.step-time{font-size:13px;color:#5b6b7f;background:#F1F5F9;padding:3px 10px;border-radius:100px;font-weight:700}
.step-desc{font-size:14.5px;color:#475569;line-height:1.6;margin-bottom:10px}
.dialoog-box{background:#F8FAFC;border:1.5px solid #E2E8F0;border-radius:10px;padding:12px 16px}
.dialoog-label{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:5px}
.dialoog-text{font-size:14.5px;color:#1E293B;line-height:1.6;font-style:italic}
.afsluiting{background:#F0FDF4;border:1.5px solid #A7F3D0;border-radius:10px;padding:14px;margin-bottom:10px}
.afsluiting-label{font-size:13px;font-weight:800;color:#047857;margin-bottom:6px;}
.afsluiting-text{font-size:14.5px;color:#1E293B;line-height:1.6}
.toetsing{background:#F8FAFC;border:1.5px solid #E2E8F0;border-radius:10px;padding:14px}
.mat-item{display:flex;gap:10px;margin-bottom:8px;font-size:14.5px;color:#475569;line-height:1.5}
.mat-dot{color:var(--accent);font-weight:800;flex-shrink:0}
.mat-uitleg{background:#F8FAFC;border-radius:10px;padding:14px;margin-bottom:10px}
.mat-uitleg-title{font-size:14.5px;font-weight:800;color:#1E293B;margin-bottom:5px}
.mat-uitleg-text{font-size:14.5px;color:#475569;line-height:1.6}
.tip-item{border-left:3px solid var(--accent);padding-left:14px;margin-bottom:14px}
.tip-title{font-size:14.5px;font-weight:800;color:#1E293B;margin-bottom:4px}
.tip-text{font-size:14.5px;color:#475569;line-height:1.55}
.begrip-item{background:var(--accent-light);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.begrip-term{font-size:14.5px;font-weight:800;color:var(--accent);margin-bottom:3px}
.begrip-def{font-size:13.5px;color:#475569;line-height:1.55}
/* Print */
@media print{
  .no-print{display:none!important}
  body{background:#fff}
  .topbar,.page-header,footer{display:none!important}
  .wrap{padding:10px;margin:0 auto}
  .app-card{border:none;box-shadow:none;padding:0}
  .card,.fiche-header{border:1px solid #ccc;break-inside:avoid}
  .tabs,.btn-row,.header{display:none}
  .tab-content{display:block!important}
}
@media(max-width:700px){.ll-grid,.ai-grid,.diff-grid{grid-template-columns:1fr}.app-card{padding:20px 18px}}
</style>
</head>

<script>
// ─── DATA ─────────────────────────────────────────────────────────────
// LET OP: de sleutels "LL23 DIG n B.x" zijn codes uit leerplan 2023. De huidige
// doelen heten ook "DIG n B.x" maar betekenen vaak iets anders. Koppelen gebeurt
// daarom nooit op gelijke code, enkel via de velden ll23 en les van een doel.
const LIBRARY = {
  "LL23 DIG 1 B.1":["Digitaal speel-hoekje inrichten","Kleutersoftware ontdekken","Tablet-speelkwartiertje","Touchscreen-raadspel","Digitale verhalenhoek"],
  "LL23 DIG 1 B.2":["Veegspelletjes op tablet","Pijlspelletje op scherm","Tik de letter aan","Schuifpuzzel app","Stippen volgen op touchscreen"],
  "LL23 DIG 1 B.3":["Vertrouwd tekenprogramma","Foto's bekijken in gallery","Eenvoudig kleurprogramma","Educatieve game herhalen","Digitale stempels"],
  "LL23 DIG 1 B.4":["Rekenmachine ontdekken","Tellen op tablet","Cijfers aanraken op scherm","Getallenlied met app","Digitale dobbelsteen"],
  "LL23 DIG 1 B.5":["Rekenmachine vs. vingers","Som op tablet oplossen","Digitale telrij","Optellen met app","Getallen linken aan tool"],
  "LL23 DIG 1 B.6":["Blindtypen oefening","Jouw naam tikken","Letterzoekspel op toetsenbord","Typrij oefening","Toetsenbord-bingo"],
  "LL23 DIG 1 B.7":["Klasfoto's maken","Video van experiment","Selfie-project","Natuur fotograferen","Foto's sorteren"],
  "LL23 DIG 1 B.8":["Verven in Paint","Bestand opslaan oefenen","Map aanmaken","Zoomen en scrollen","Kopiëren en plakken"],
  "LL23 DIG 1 B.9":["Verhaal tikken in Word","Briefje typen","Woordenlijst maken","Tekst opmaken","Dictee in tekstverwerker"],
  "LL23 DIG 1 B.10":["Digitaal kunstwerk maken","Presentatie illustreren","Collage met foto's","Animatie bouwen","Digitaal kleurboek"],
  "LL23 DIG 1 B.11":["Beveiligd zoeken in browser","Afbeelding opzoeken","Dierenfeitenzoektocht","Zoekopdracht in klas","Veilig surfen-les"],
  "LL23 DIG 1 B.12":["Geluidsfragment opnemen","Podcast-intro","Geluiden van dieren opnemen","Interview opnemen","Muziek opnemen"],
  "LL23 DIG 1 B.13":["Foto bewerken met filter","Achtergrond veranderen","Collage maken","Kleur aanpassen","Bijschrift toevoegen"],
  "LL23 DIG 1 B.14":["Tekst opmaken in Word","Koptitels instellen","Lettertype kiezen","Lijst maken","Afbeelding invoegen"],
  "LL23 DIG 1 B.15":["Rekenmachine gebruiken","Sommetjes controleren","Eenvoudige berekeningen","Procenten uitrekenen","Tabel invullen met calculator"],

      {code:"DIG 1 B.16",age:7,md:["MD L4 8.2.2"],text:"Een aangereikt digitaal apparaat gebruiken om geluid op te nemen.",ll23:["DIG 1 B.12"],vorig:["DIG 1.11"]},
      {code:"DIG 1 B.17",age:8,md:["MD L4 8.1.1", "MD L6 8.1.2"],text:"De begrippen de invoer, de verwerking, de uitvoer, de opslag kennen en gebruiken.",onder:["Bij het nemen van een foto met je smartphone benoemen dat het indrukken van de knop om de foto te nemen de invoer is, het nemen van het beeld door de smartphone de verwerking is, het tonen van de foto op het scherm de uitvoer is en het bewaren van de foto op de geheugenkaart de opslag."],vorig:["DIG 2.13", "DIG 2.25"]},
      {code:"DIG 1 B.18",age:8,md:["MD L4 8.2.2"],text:"Invoer- en uitvoerapparaten functioneel gebruiken met inbegrip van het basisgebruik van een toetsenbord.",onder:["Invoerapparaten zoals toetsenbord, muis, touchscreen, en uitvoerapparaten zoals beeldscherm, koptelefoon, luidsprekers functioneel gebruiken."],vorig:["DIG 1.12"]},
      {code:"DIG 1 B.19",age:8,md:["MD L4 8.2.4"],text:"Een zoekvraag formuleren als zoekstrategie om in digitale bronnen informatie te vinden en te raadplegen.",onder:["Onder begeleiding een zoekvraag formuleren als strategie om informatie te vinden in digitale bronnen."],vorig:["DIG 1.13"]},
      {code:"DIG 1 B.20",age:8,md:["MD L4 8.2.4"],text:"Een zoektool kiezen als zoekstrategie om in digitale bronnen informatie te vinden en te raadplegen.",onder:["Onder begeleiding een zoektool zoals een zoekbalk, zoekmachine of een routeplanner gebruiken om informatie te vinden en te raadplegen."],vorig:["DIG 1.14"]},
      {code:"DIG 1 B.21",age:8,md:["MD L4 8.2.4"],text:"Een zoekopdracht formuleren als zoekstrategie om in digitale bronnen informatie te vinden en te raadplegen.",onder:["Onder begeleiding een zoekopdracht met trefwoorden of afbeeldingen formuleren."],vorig:["DIG 1.15"]},
      {code:"DIG 1 B.22",age:8,md:["MD L4 8.2.4", "MD L6 8.2.7"],text:"Aan de hand van aangereikte criteria de gevonden zoekresultaten in digitale bronnen beoordelen op bruikbaarheid.",onder:["Aan de hand van aangereikte criteria zoals ‘geeft het antwoord op de onderzoeksvraag’, ‘mag de informatie zomaar gebruikt worden’, beoordelen of de digitale bron bruikbaar is."],vorig:["DIG 1.33"]},
      {code:"DIG 1 B.23",age:8,md:[],text:"Met een aangereikte tool afbeeldingen of foto’s bewerken om eigen ideeën creatief vorm te geven.",cursief:true,onder:["Met een eenvoudige aangereikte tool afbeeldingen of foto’s bewerken, zoals de grootte wijzigen, het formaat bijsnijden, filters gebruiken, roteren, sepia- of zwart-witeffecten toepassen, om eigen ideeën creatief vorm te geven."],ll23:["DIG 1 B.13"],vorig:["DIG 1.16"]},
      {code:"DIG 1 B.24",age:8,md:["MD L6 8.4.1"],text:"Een aangereikte tool gebruiken om op een veilige, verantwoorde en doelmatige manier te communiceren.",onder:["De klas- en schoolafspraken rond digitale communicatie volgen.", "Aandacht geven aan bescherming van de persoonsgegevens, omgaan met paswoorden, het delen van foto’s en informatie …"],ll23:["DIG 1 B.17"],vorig:["DIG 1.18"]},
      {code:"DIG 1 B.25",age:9,md:["MD L4 8.2.3", "MD L6 8.2.2"],text:"Bestanden openen om te bewerken en sluiten om te bewaren.",vorig:["DIG 1.23"]},
      {code:"DIG 1 B.26",age:9,md:["MD L4 8.1.1"],text:"De begrippen verzenden, ontvangen, offline, online kennen en gebruiken.",onder:["Een bericht versturen gebeurt online en een foto bekijken die al op een toestel staat, kan ook offline."],vorig:["DIG 2.24"]},
      {code:"DIG 1 B.27",age:9,md:[],text:"Een aangereikte tool gebruiken om informatie aan anderen voor te stellen.",cursief:true,ll23:["DIG 1 B.18"],vorig:["DIG 1.19"]},
      {code:"DIG 1 B.28",age:9,md:[],text:"Met aangereikte digitale tools zelfstandig oefenen en leren.",cursief:true,ll23:["DIG 1 B.20"],vorig:["DIG 1.21"]},
      {code:"DIG 1 B.29",age:9,md:["MD L4 8.2.3"],text:"Bestanden gebruiken via de bestaande mappenstructuur van het systeem.",onder:["Naar de juiste locatie navigeren.", "Het juiste bestand selecteren.", "Het bestand terugplaatsen in de juiste map."],vorig:["DIG 1.22"]}
    ],
    4:[
      {code:"DIG 1 B.30",age:10,md:["MD L6 8.2.7"],text:"Gebruikte digitale bronnen vermelden."},
      {code:"DIG 1 B.31",age:10,md:["MD L6 8.2.4"],text:"Eenvoudige systeeminstellingen aanpassen.",onder:["Eenvoudige systeeminstellingen aanpassen zoals de weergave-, taalinstellingen, wifi aan- of uitzetten."],vorig:["DIG 1.24"]},
      {code:"DIG 1 B.32",age:10,md:["MD L6 8.2.2"],text:"Zoekresultaten uit digitale bronnen verwerken en bewaren.",ll23:["DIG 1 B.21"],vorig:["DIG 1.25"]},
      {code:"DIG 1 B.33",age:11,md:["MD L6 8.1.1"],text:"Begrijpen hoe invoer, verwerking, uitvoer en opslag samen een digitaal informatieverwerkingsproces vormen.",onder:["Begrijpen dat een tablet een bericht verwerkt: je typt iets (invoer), het toestel verwerkt dit en toont het bericht op het scherm (uitvoer).", "Bij een online rekenoefening:\n• wordt een antwoord ingevoerd (invoer);\n• controleert de computer het antwoord (verwerking);\n• toont een melding ‘goed’ of ‘fout’ (uitvoer);\n• bewaart het resultaat in het leerlingdossier (opslag)."],vorig:["DIG 2.26"]},
      {code:"DIG 1 B.34",age:11,md:["MD L6 8.1.2"],text:"De begrippen het netwerk, de verbinding kennen en gebruiken.",onder:["Begrijpen dat de computers op school via een netwerk met elkaar verbonden zijn."],vorig:["DIG 2.27"]},
      {code:"DIG 1 B.35",age:11,md:["MD L6 8.1.1"],text:"Begrijpen dat een verbinding nodig is om informatie te delen.",onder:["Bij het versturen van een e-mail reist die via verschillende netwerken naar de ontvanger."],vorig:["DIG 2.28"]},
      {code:"DIG 1 B.36",age:11,md:["MD L6 8.1.1"],text:"Weten dat netwerktechnologieën, zoals kabel, wifi, mobiel netwerk, via netwerken met elkaar verbonden zijn en op die manier gegevens kunnen gedeeld worden.",onder:["Beschrijven hoe een foto die met een smartphone wordt genomen, via wifi of een mobiel netwerk naar een computer of naar de cloud kan worden gestuurd."],vorig:["DIG 2.29"]},
      {code:"DIG 1 B.37",age:11,md:["MD L6 8.1.1"],text:"Weten dat gegevens op een andere locatie dan het eigen digitale apparaat kunnen worden verwerkt en worden opgeslagen.",onder:["Begrijpen dat bij online gamen meerdere spelers tegelijk in verbinding staan via het internet, zodat ze samen kunnen spelen en communiceren (realtime gegevensuitwisseling)."],vorig:["DIG 2.30"]},
      {code:"DIG 1 B.38",age:11,md:["MD L6 8.2.3"],text:"Bestanden beheren via een aangereikte structuur.",onder:["Bestanden beheren via een aangereikte structuur zoals aanmaken, verwijderen en herbenoemen van mappen en bestanden, verwijderen van overbodige of foute bestanden, terughalen van verwijderde bestanden."],vorig:["DIG 1.26"]},
      {code:"DIG 1 B.39",age:11,md:["MD L6 8.2.2"],text:"Bestanden downloaden en opslaan op verschillende door hen gekende opslagmedia.",onder:["Bestanden downloaden en opslaan volgens de afgesproken criteria in de instructie."],ll23:["DIG 1 B.23"],vorig:["DIG 1.27"]},
      {code:"DIG 1 B.40",age:11,md:["MD L6 8.2.2"],text:"Bestanden uploaden, terugvinden en delen met een klasgenoot in een door hen gekende digitale omgeving.",onder:["Bestanden uploaden, terugvinden en delen volgens de afgesproken criteria in de instructie."],ll23:["DIG 1 B.24"],vorig:["DIG 1.28"]},
      {code:"DIG 1 B.41",age:11,md:["MD L6 8.2.1"],text:"Invoer- en uitvoerapparaten doelgericht gebruiken en instellen met inbegrip van vlot gebruik van een toetsenbord.",onder:["Invoerapparaten zoals toetsenbord, muis, touchscreen, microfoon, camera, en uitvoerapparaten zoals beeldscherm, printer, luidspreker, projector doelgericht gebruiken en instellen."],vorig:["DIG 1.29"]},
      {code:"DIG 1 B.42",age:11,md:["MD L6 8.4.1"],text:"De mogelijkheden van digitale tools om te communiceren kennen.",onder:["Mogelijkheden van digitale tools om te communiceren zoals berichten, e-mail, chat, reacties of videogesprekken kennen."],vorig:["DIG 1.30"]},
      {code:"DIG 1 B.43",age:11,md:["MD L6 8.2.5"],text:"Het begrip artificiële intelligentie kennen.",onder:["Het begrip artificiële intelligentie kennen als een tool die taken uitvoert waarvoor normaal gesproken menselijke intelligentie nodig is, zoals taal begrijpen, beelden herkennen of beslissingen nemen."],vorig:["DIG 1.31"]},
      {code:"DIG 1 B.44",age:11,md:["MD L6 8.2.8"],text:"Voorbeelden geven van toepassingen waarin artificiële intelligentie (AI) gebruikt wordt.",onder:["Voorbeelden van AI-toepassingen geven zoals spraakherkenning, vertaaltools, virtuele assistenten, gezichtsherkenning."],vorig:["DIG 1.32"]},
      {code:"DIG 1 B.45",age:11,md:["MD L6 8.2.7"],text:"Aan de hand van aangereikte criteria de gevonden digitale bronnen beoordelen op betrouwbaarheid.",onder:["Aan de hand van aangereikte criteria zoals ‘van wie komt de informatie’, ‘is het een betrouwbare bron’, de informatie dubbelchecken om te beoordelen of de digitale bron betrouwbaar is."],vorig:["DIG 1.33"]},
      {code:"DIG 1 B.46",age:11,md:["MD L6 8.2.7"],text:"Aan de hand van aangereikte criteria de gevonden digitale bronnen beoordelen op correctheid.",onder:["Aan de hand van aangereikte criteria zoals verouderde informatie, bronnenlijst, dubbelchecken, beoordelen of de digitale bron correct is."],vorig:["DIG 1.33"]},
      {code:"DIG 1 B.47",age:11,md:[],text:"Reflecteren op de meerwaarde van het gebruik van digitale toepassingen.",cursief:true,onder:["Reflecteren op basis van vooraf bepaalde criteria over de meerwaarde van het gebruik van digitale toepassingen."],ll23:["DIG 1 B.25"],vorig:["DIG 1.34"]}
    ],
    U:[
      {code:"DIG 1 U.1",age:null,md:[],text:"Andere digitale tools zoals lasermeter, fietscomputer, routeplanner, fotobewerkingsprogramma instellen, bedienen en gebruiken.",cursief:true},
      {code:"DIG 1 U.2",age:null,md:[],text:"Exploreren van virtuele realiteit en artificiële intelligentie.",cursief:true},
      {code:"DIG 1 U.3",age:null,md:[],text:"AI-gegenereerde informatie en andere digitale bronnen kritisch beoordelen.",cursief:true}
    ]
  }},
  comp:{label:"Computationeel denken",icon:"🧩",color:"#7C3AED",colorLight:"#F5F3FF",doelen:{
    1:[
      {code:"DIG 2 B.1",age:4,md:["MD L4 8.1.3"],text:"Onder begeleiding een eenvoudig stappenplan volgen om een opdracht of doel te bereiken.",onder:["Een stappenkaart volgen om een toren te bouwen met blokken."],les:["LL23 DIG 2 B.12"]}
    ],
    2:[
      {code:"DIG 2 B.2",age:5,md:["MD L4 8.1.3"],text:"Onder begeleiding patronen en herhalingen herkennen in opdrachten, bewegingen en reeksen.",onder:["Een klap-stamp-klap-stampritme verderzetten."],verdiep:["Een digitaal patroonspel of een eenvoudige herhaalopdracht met een robot uitvoeren."],les:["LL23 DIG 2 B.6", "LL23 DIG 2 B.8", "LL23 DIG 2 B.3"]},
      {code:"DIG 2 B.3",age:5,md:["MD L4 8.1.3"],text:"Onder begeleiding een eenvoudig stappenplan opstellen, uitvoeren en controleren.",onder:["Zelf de stappen bedenken om een plant water te geven en nagaan of niets vergeten is."],verdiep:["Een route uitstippelen voor een robot en aanpassen wanneer de robot verkeerd rijdt."],les:["LL23 DIG 2 B.7"]},
      {code:"DIG 2 B.4",age:6,md:["MD L4 8.1.3"],text:"Belangrijke kenmerken onderscheiden en minder relevante details weglaten (abstractie).",onder:["Een maquette of plattegrond van de klas tekenen met alleen de belangrijke voorwerpen."],verdiep:["Een digitale kaart of tekening maken waarbij enkel noodzakelijke elementen worden toegevoegd."]},
      {code:"DIG 2 B.5",age:6,md:["MD L4 8.1.3"],text:"Patronen herkennen in eenvoudige situaties (patroonherkenning).",onder:["Een reeks vormen, kleuren of bewegingen verderzetten."],verdiep:["Een patroonspel spelen in een leerapp of met een programmeerbare robot."],les:["LL23 DIG 2 B.6", "LL23 DIG 2 B.10#lib"]},
      {code:"DIG 2 B.6",age:6,md:["MD L4 8.1.3"],text:"Stappen in een vaste volgorde plaatsen en uitvoeren (sequentie).",onder:["De stappen van tandenpoetsen in de juiste volgorde leggen."],verdiep:["Een reeks programmeerblokken in de juiste volgorde plaatsen om een personage te laten bewegen."],les:["LL23 DIG 2 B.4", "LL23 DIG 2 B.10#rub"]},
      {code:"DIG 2 B.7",age:6,md:["MD L4 8.1.3"],text:"Onder begeleiding een lineair algoritme uitvoeren, testen en verbeteren.",onder:["Een klasgenoot via mondelinge instructies door een hindernissenparcours leiden en de instructies aanpassen wanneer iets fout loopt."],verdiep:["Een reeks programmeerblokken gebruiken om een robot of personage aan te sturen."],les:["LL23 DIG 2 B.11"]}
    ],
    3:[
      {code:"DIG 2 B.8",age:7,md:["MD L4 8.1.3"],text:"Een probleem opdelen in kleinere deelproblemen (decompositie).",onder:["Een probleem onder begeleiding ontleden (bv. een optelsom in wiskunde: eerst de tientallen en dan de eenheden samentellen om vervolgens de uitkomsten samen te tellen)."],verdiep:["Een groter programmeerproject opdelen in verschillende opdrachten of scènes."],les:["LL23 DIG 2 B.14"]},
      {code:"DIG 2 B.9",age:7,md:["MD L4 8.1.3"],text:"Eenvoudige instructies formuleren met woorden, symbolen of visuele voorstellingen.",onder:["Een schatkaart maken met pijlen en symbolen waarmee een klasgenoot een voorwerp terugvindt."],les:["LL23 DIG 2 B.11"]},
      {code:"DIG 2 B.10",age:8,md:["MD L4 8.1.3"],text:"Fouten opsporen en verbeteren in een stappenplan of eenvoudige computercode (debuggen).",onder:["Een fout zoeken in een recept of routebeschrijving en verbeteren."],les:["eigen:scratch-debuggen"]},
      {code:"DIG 2 B.11",age:8,md:["MD L4 8.1.3"],text:"Onder begeleiding een lineair algoritme ontwerpen, uitvoeren, testen en debuggen om tot een werkende oplossing te komen.",onder:["Een papieren doolhof oplossen door een stappenplan te schrijven en fouten te verbeteren.", "Een spelinstructie ontwerpen waarbij het probleem eerst wordt opgesplitst en getest."],verdiep:["Een eenvoudige animatie of verhaal in een programmeertool ontwerpen en verbeteren."],les:["eigen:scratch-lineair"]},
      {code:"DIG 2 B.12",age:8,md:["MD L4 8.2.5"],text:"Een eenvoudige zoekstrategie ontwikkelen en toepassen om informatie of een oplossing te vinden.",onder:["Zoekwoorden bedenken om betrouwbare informatie over een dier te vinden."],verdiep:["Zoekwoorden kiezen in een kindvriendelijke zoekmachine en de resultaten bekijken."]},
      {code:"DIG 2 B.13",age:9,md:["MD L4 8.1.2"],text:"Het begrip algoritme kennen en gebruiken.",onder:["Een algoritme beschrijven als een duidelijke reeks instructies om een doel te bereiken, zoals een recept of routebeschrijving."],les:["LL23 DIG 2 B.15"]},
      {code:"DIG 2 B.14",age:9,md:["MD L4 8.1.3"],text:"Problemen omzetten in een stappenplan, schema of andere passende visuele voorstelling (abstractie).",onder:["Een stappenplan maken voor het organiseren van een klasactiviteit."],verdiep:["Een digitaal stroomschema of storyboard maken."],les:["LL23 DIG 2 B.17"]},
      {code:"DIG 2 B.15",age:9,md:["MD L4 8.2.5"],text:"Onder begeleiding een zoekstrategie uitwerken en toepassen vanuit de principes van computationeel denken.",onder:["Verschillende boeken, woordenlijsten of personen vergelijken om de beste informatiebron te kiezen."],verdiep:["Zoektermen aanpassen wanneer een zoekopdracht te veel of te weinig bruikbare resultaten geeft."],vorig:["DIG 2.23"]},
      {code:"DIG 2 B.16",age:9,md:["MD L4 8.1.3"],text:"Onder begeleiding de principes van computationeel denken toepassen om een lineair algoritme te ontwerpen, testen en debuggen om tot een werkende oplossing te komen (opbouw sequentie).",onder:["De stappen uitwerken voor een klasactiviteit (bv. een spel organiseren), testen en verbeteren."],vorig:["DIG 2.22"],les:["eigen:scratch-lineair"]}
    ],
    4:[
      {code:"DIG 2 B.17",age:10,md:["MD L6 8.1.3"],text:"Onder begeleiding een algoritme ontwerpen, testen en debuggen met behulp van keuzes.",onder:["Een beslissingsspel maken met kaarten: ‘ALS je een rode kaart trekt, DAN ga je links, ANDERS ga je rechts.’"],les:["LL23 DIG 2 B.19"]},
      {code:"DIG 2 B.18",age:10,md:["MD L6 8.1.3"],text:"Onder begeleiding een algoritme ontwerpen waarin herhalingen doelgericht worden toegepast.",onder:["Een dansreeks maken waarin dezelfde bewegingen meerdere keren worden herhaald."],verdiep:["Een herhaalblok gebruiken om een figuur meerdere keren een patroon te laten tekenen."],les:["LL23 DIG 2 B.20"]},
      {code:"DIG 2 B.19",age:11,md:["MD L6 8.1.3"],text:"Patronen in abstracte situaties herkennen en beschrijven (patroonherkenning).",onder:["Regelmatigheden zoeken in tabellen, cijferreeksen of wetenschappelijke observaties."],verdiep:["Patronen ontdekken in digitale gegevens of simulaties."],ll23:["DIG 2 B.18"],vorig:["DIG 2.32"]},
      {code:"DIG 2 B.20",age:11,md:["MD L6 8.1.3"],text:"Onder begeleiding de principes van computationeel denken toepassen om een algoritme te ontwerpen, testen en debuggen om tot een werkende oplossing te komen (combinatie van sequentie, herhaling, keuze).",verdiep:["Een spel programmeren waarin een personage blijft bewegen tot het een obstakel raakt en dan een andere richting kiest."],vorig:["DIG 2.33"],les:["LL23 DIG 2 B.20", "eigen:scratch-combinatie"]},
      {code:"DIG 2 B.21",age:11,md:["MD L6 8.2.6"],text:"Een zoekstrategie uitwerken, toepassen en indien nodig bijsturen vanuit de principes van computationeel denken.",onder:["Een onderzoeksopdracht plannen: bepalen welke informatie nodig is, welke bronnen bruikbaar zijn, en de aanpak aanpassen wanneer de informatie onvoldoende is."],verdiep:["Een eenvoudige en effectieve prompt formuleren in een door de school beschikbaar gestelde AI-tool om content/informatie te verkrijgen."],vorig:["DIG 2.34"]}
    ]
  }},
  media:{label:"Mediawijsheid",icon:"📱",color:"#047857",colorLight:"#ECFDF5",doelen:{
    1:[
      {code:"DIG 3 B.1",age:3,md:["MD L6 8.3.4"],text:"Kennismaken met verschillende vormen van mediaboodschappen.",ll23:["DIG 3 B.1"],vorig:["DIG 3.1"]}
    ],
    2:[
      {code:"DIG 3 B.2",age:5,md:["MD L6 8.3.4"],text:"Reflecteren over hoe zij digitale media gebruiken in hun dagelijks leven.",ll23:["DIG 3 B.2"],vorig:["DIG 3.2"]}
    ],
    3:[
      {code:"DIG 3 B.3",age:7,md:["MD L4 8.3.1", "MD L6 8.3.3"],text:"Voor hen gekende login en wachtwoord gebruiken en hier veilig mee werken.",ll23:["DIG 3 B.3"],vorig:["DIG 3.3"]},
      {code:"DIG 3 B.4",age:7,md:["MD L6 8.3.4"],text:"Weten dat veel informatie digitaal beschikbaar is en dat de wereld doordrongen is van audiovisuele boodschappen, maar dat wat online staat, niet noodzakelijk waar is.",onder:["Onder begeleiding voorbeelden van gemanipuleerde media zoals reclameboodschappen, nepnieuws bekijken en de manipulatie benoemen."],ll23:["DIG 3 B.4"],vorig:["DIG 3.4"]},
      {code:"DIG 3 B.5",age:8,md:["MD L6 8.3.4"],text:"Weten dat personen zich via digitale media anders kunnen voordoen dan in werkelijkheid, en hier alert en gepast op reageren (veiligheidsaspecten).",onder:["Bij twijfel alert en gepast reageren door dit te melden aan een bekende volwassene."],ll23:["DIG 3 B.5"],vorig:["DIG 3.5"]},
      {code:"DIG 3 B.6",age:8,md:["MD L4 8.3.1", "MD L6 8.3.3"],text:"Waakzaam zijn bij het doorgeven van persoonlijke gegevens.",onder:["Onder begeleiding reflecteren over de gevaren van het doorgeven van persoonlijke gegevens."],ll23:["DIG 3 B.6"],vorig:["DIG 3.6"]},
      {code:"DIG 3 B.7",age:8,md:["MD L6 8.3.4"],text:"Elementaire regels en omgangsvormen bij digitale communicatie respecteren (ethische aspecten).",onder:["De klas- en schoolafspraken rond digitale communicatie volgen.", "Een vooraf afgesproken en gekend communicatiekanaal gebruiken."],ll23:["DIG 3 B.7"],vorig:["DIG 3.7"]},
      {code:"DIG 3 B.8",age:8,md:["MD L6 8.3.3"],text:"Bij ongewenste boodschappen of schokkende informatie een bekende volwassene verwittigen.",onder:["Onder begeleiding bespreken in welke situaties je hulp inroept van een volwassene die je vertrouwt."],ll23:["DIG 3 B.8"],vorig:["DIG 3.8"]},
      {code:"DIG 3 B.9",age:8,md:["MD L6 8.3.4"],text:"Inzien dat digitale media niet mogen gebruikt worden om anderen lastig te vallen of te pesten, en dit toepassen (ethische aspecten).",onder:["De effecten van pesten via digitale media op anderen benoemen."],ll23:["DIG 3 B.9"],vorig:["DIG 3.9"]},
      {code:"DIG 3 B.10",age:9,md:["MD L4 8.3.1"],text:"De begrippen de online privacy, de persoonlijke gegevens, de/het account kennen en gebruiken.",vorig:["DIG 3.10"]},
      {code:"DIG 3 B.11",age:9,md:["MD L6 8.3.4"],text:"De invloed van digitale media herkennen op je eigen mening en de mening van anderen (sociale aspecten).",onder:["Onder begeleiding ervaren dat onze keuzes beïnvloed worden door digitale media."],ll23:["DIG 3 B.10"],vorig:["DIG 3.11"]}
    ],
    4:[

/* ── TEACHER PROGRESS (localStorage) ──
   v2 bewaart codes van het huidige leerplan. v1 (vorige versie) wordt één keer
   omgezet en blijft ongewijzigd staan als reservekopie. */
const PROG_KEY_OUD='teacherProgress_v1';
const PROG_KEY='teacherProgress_v2';
const PROG_LEERPLAN='LL-2026-11-19';
const STATUSSEN=['bezig','behandeld','geëvalueerd'];
let PROG={};        // code → {status,updated,van?}
let HERBEKIJK={};   // vorige code → {status,updated}

/* Zet voortgang met codes uit een vorige versie om. Een code die niet met
   zekerheid bij één huidig doel hoort, komt in "te herbekijken": nooit stil
   op een doel dat toevallig dezelfde code draagt. */
function zetVoortgangOm(oud){
  const prog={},herbekijk={};
  Object.entries(oud||{}).forEach(([c,v])=>{
    if(!v||!STATUSSEN.includes(v.status))return;
    if(VORIG_AUTO[c])prog[VORIG_AUTO[c]]={status:v.status,updated:v.updated,van:c};
    else herbekijk[c]={status:v.status,updated:v.updated};
  });
  return{prog,herbekijk};
}
/* Enkel bestaande codes met een geldige status overnemen */
function schoneVoortgang(p){
  const r={},rest={};
  Object.entries(p||{}).forEach(([c,v])=>{
    if(!v||!STATUSSEN.includes(v.status))return;
    if(findDoel(c))r[c]=v;else rest[c]={status:v.status,updated:v.updated};
  });
  return{r,rest};
}
function leesJson(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
function saveProgress(){localStorage.setItem(PROG_KEY,JSON.stringify({leerplan:PROG_LEERPLAN,progress:PROG,herbekijk:HERBEKIJK}));}
/* Voortgang overnemen uit opslag of bestand. Zonder de huidige leerplanversie
   gaat het om oudere codes en wordt er omgezet. */
function neemVoortgang(d){
  if(d.leerplan===PROG_LEERPLAN){
    const{r,rest}=schoneVoortgang(d.progress);
    PROG=r;const h=schoneVoortgang(d.herbekijk);
    HERBEKIJK={...h.r,...h.rest,...rest};   // ook codes die op een huidige code lijken blijven hier staan
  }else{
    const o=zetVoortgangOm(d.progress||d);
    PROG=o.prog;HERBEKIJK=o.herbekijk;
  }
}
function laadVoortgang(){
  const v2=leesJson(PROG_KEY);
  if(v2&&v2.leerplan===PROG_LEERPLAN){neemVoortgang(v2);return;}
  const v1=leesJson(PROG_KEY_OUD);
  if(v1){neemVoortgang({progress:v1});saveProgress();}
}
function setProgress(code,status){
  if(!status){delete PROG[code];}else{PROG[code]={status,updated:new Date().toISOString()};}
  saveProgress();render();
}
function cycleProgress(code){
  const cycle=[null,...STATUSSEN];
  const cur=PROG[code]?.status||null;
  setProgress(code,cycle[(cycle.indexOf(cur)+1)%cycle.length]);
}
/* Status van een te herbekijken code op een gekozen doel zetten. Een doel dat
   al een status heeft, wordt niet aangeboden en dus nooit overschreven. */
function neemOver(oud,code){
  const h=HERBEKIJK[oud];
  if(!h||!findDoel(code)||PROG[code])return;
  PROG[code]={status:h.status,updated:h.updated,van:oud};
  if((VORIG_HERBEKIJK[oud]?.naar||[]).every(c=>PROG[c]))delete HERBEKIJK[oud];
  saveProgress();render();
}
function verwerpHerbekijk(i){delete HERBEKIJK[Object.keys(HERBEKIJK)[i]];saveProgress();render();}
function wisVoortgang(){
  if(!confirm('Alle voortgangstatussen wissen?'))return;
  PROG={};HERBEKIJK={};saveProgress();render();
}
function exportProgress(){
  const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),leerplan:PROG_LEERPLAN,progress:PROG,herbekijk:HERBEKIJK},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='voortgang_leerkracht_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function importProgress(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(!d||typeof d!=='object'||Array.isArray(d))throw 0;
        neemVoortgang(d);saveProgress();render();
      }catch{alert('Ongeldig bestand.');}
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ── LESIDEEËN BIJ EEN DOEL ──
   officieel via d.ll23, op betekenis via d.les; nooit via gelijke code. */
function ideeenVoor(d){
  const bronnen=[...(d.ll23||[]).map(c=>"LL23 "+c),...(d.les||[])];
  const uit=[],gezien=new Set();
  const voegToe=lijst=>(lijst||[]).forEach(idee=>{
    const k=idee.trim().toLowerCase();
    if(!gezien.has(k)){gezien.add(k);uit.push(idee);}
  });
  bronnen.forEach(b=>{const[k,deel]=b.split("#");if(deel!=="rub")voegToe(LIBRARY[k]);});
  bronnen.forEach(b=>{const[k,deel]=b.split("#");if(deel!=="lib")voegToe(RUBRIC_IDEAS[k]);});
  return uit;
}

/* ── ZOEKTEKST ──
   Codes uit leerplan 2023 zitten er bewust niet in: ze lijken op huidige codes. */
function norm(t){return String(t).toLowerCase().replace(/[’‘]/g,"'");}
function zoektekst(d){return norm([d.code,d.text,d.md.join(" "),(d.vorig||[]).join(" "),(d.onder||[]).join(" "),(d.verdiep||[]).join(" ")].join(" "));}
/* "dig 1 b.6", "1 b6", "B.6", "u.2" → exact op de huidige code */
function codeVraag(q){
  const m=q.match(/^(?:dig\s*)?(?:([123])\s*)?([bu])\s*\.?\s*(\d+)$/i);
  return m?{ll:m[1]||null,soort:m[2].toUpperCase(),nr:m[3]}:null;
}
function isCode(code,v){
  const m=code.match(/^DIG (\d) ([BU])\.(\d+)$/);
  return !!m&&(!v.ll||m[1]===v.ll)&&m[2]===v.soort&&m[3]===v.nr;
}
/* Vorige versie "dig 1.4": exact, zodat 1.3 niet ook 1.33 vindt */
function vorigVraag(q){const m=q.match(/^(?:dig\s*)?([123]\.\d+)$/i);return m?"DIG "+m[1]:null;}
function doelHit(d,q){
  q=norm(q).trim();
  const v=codeVraag(q);if(v)return isCode(d.code,v);
  const o=vorigVraag(q);if(o)return(d.vorig||[]).includes(o);
  return textHit(zoektekst(d),q);
}

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escRegex(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function isExactAliasQuery(q){return TOOL_MAP.some(t=>t.aliases.includes(q));}
function textHit(hay,q){
  // Programmanamen die ook een Nederlands woorddeel zijn (bv. "word" zit in
  // "wordt/worden") matchen enkel als exact woord; andere zoektermen blijven
  // als deelwoord matchen zodat bv. "algorit" → "algoritme" werkt.
  if(isExactAliasQuery(q))return new RegExp("\\b"+escRegex(q)+"\\b","i").test(hay);
  return hay.includes(q);
}

function toolMatches(t,q){
  return t.aliases.some(a=>{
    if(a===q)return true;
    if(q.length>=3&&a.includes(q))return true;        // "powerp" → PowerPoint
    return q.split(/\s+/).includes(a);                 // "les met word" → Word
  });
}

    if(k)localStorage.setItem(API_KEY_STORE,k);

async function callClaude(prompt,max=2500){
  const key=getApiKey();
  if(!key)throw new Error("Geen API-sleutel ingesteld. Klik onderaan op '🔑 API-sleutel instellen'.");
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","anthropic-version":"2023-06-01","x-api-key":key,"anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:max,messages:[{role:"user",content:prompt}]})});
  if(r.status===401){
    localStorage.removeItem(API_KEY_STORE);
    throw new Error("De API-sleutel werd geweigerd. Controleer hem op console.anthropic.com en stel hem opnieuw in via '🔑 API-sleutel instellen'.");
  }
  if(!r.ok){
    const raw=await r.text();
    if(raw.includes("credit balance is too low"))
      throw new Error("Je API-tegoed is op (of nog niet opgeladen). Ga naar console.anthropic.com → Plans & Billing → Purchase credits. De sleutel zelf is in orde.");
    if(raw.includes("rate_limit"))
      throw new Error("Te veel aanvragen kort na elkaar. Wacht even en probeer opnieuw.");
    if(raw.includes("overloaded"))
      throw new Error("De AI-dienst is tijdelijk overbelast. Probeer het zo dadelijk opnieuw.");
    throw new Error(raw);
  }
  const d=await r.json();
  const text=d.content.map(b=>b.text||"").join("");
  const m=text.match(/\{[\s\S]*\}/);
  if(!m)throw new Error("Geen JSON: "+text.slice(0,200));
  return JSON.parse(m[0]);
}

function renderGlobalResults(){
  const wrap=document.getElementById("globalResults");
  const viewArea=document.getElementById("viewArea");
  if(!wrap||!viewArea)return;
  const q=norm(S.gq||"").trim();
  if(q.length<2){
    wrap.innerHTML="";
    viewArea.style.display="";

  }
  viewArea.style.display="none";
  let h=`<div class="clear-search-row"><button type="button" class="btn-ghost" style="padding:6px 14px;font-size:13.5px" onclick="clearGlobalSearch()">✕ Wis zoekopdracht</button></div>`;
  const shown=new Set();

  // 1. Programma-treffers
  TOOL_MAP.filter(t=>toolMatches(t,q)).forEach(t=>{
    const cards=t.codes.map(findDoel).filter(Boolean)
      .map(({ll,f,d})=>{shown.add(d.code);return goalCardHtml(ll,f,d,true,t.name);}).join("");
    if(cards)h+=`<div class="ll-group">
      <div class="ll-group-header" style="background:#FEF3C7;color:#92400E;border-left:4px solid #9a5b00">🔗 ${t.name} — ${t.uitleg}</div>
      <div class="goals-list">${cards}</div>
    </div>`;
  });

  // 2. Tekstuele treffers in de doelen zelf
  const txt=ALL_DOELEN.filter(({d})=>
    !shown.has(d.code)&&doelHit(d,q)
  );
  // 3. Code uit leerplan 2023: apart tonen, want ze lijkt op een huidige code
  const cv=codeVraag(q);
  const oud23=cv&&cv.soort==="B"?ALL_DOELEN.filter(({d})=>(d.ll23||[]).some(c=>isCode(c,cv)&&c!==d.code)):[];
  if(txt.length){
    h+=`<div class="ll-group">
      <div class="ll-group-header" style="background:#f1f5f9;color:#475569;border-left:4px solid #5b6b7f">📄 Doelen met "${esc(S.gq.trim())}"</div>
      <div class="goals-list">${txt.map(({ll,f,d})=>goalCardHtml(ll,f,d,true)).join("")}</div>
    </div>`;
  }

  if(oud23.length){
    h+=`<div class="ll-group">
      <div class="ll-group-header" style="background:#FEF3C7;color:#92400E;border-left:4px solid #9a5b00">🕰 Zocht je de code uit leerplan 2023? Dat doel heeft nu een andere code</div>
      <div class="goals-list">${oud23.map(({ll,f,d})=>goalCardHtml(ll,f,d,true)).join("")}</div>
    </div>`;
  }
  // 4. Code uit de vorige LeerLokaal-versie zonder één-op-één-opvolger
  const vv=vorigVraag(q);
  const vh=vv&&VORIG_HERBEKIJK[vv];
  if(vh){
    const cards=vh.naar.filter(c=>!txt.some(x=>x.d.code===c)).map(findDoel).map(({ll,f,d})=>goalCardHtml(ll,f,d,true)).join("");
    if(cards||!vh.naar.length)h+=`<div class="ll-group">
      <div class="ll-group-header" style="background:#FEF3C7;color:#92400E;border-left:4px solid #9a5b00">🕰 ${vv} uit de vorige versie: ${esc(vh.text)}</div>
      <div class="goals-list">${cards||(vh.naar.length?"":`<div class="info-box">Geen overeenkomstig doel meer in het huidige leerplan.</div>`)}</div>
    </div>`;
  }

  if(shown.size===0&&txt.length===0&&oud23.length===0&&!vh){
    h+=`<div class="no-results" style="display:block">Geen doelen gevonden voor "${esc(S.gq.trim())}".<br>Probeer een ander kernwoord (bv. typen, zoeken, algoritme, privacy) of een programmanaam (bv. Word, Scratch, Teams).</div>`;
  }
  wrap.innerHTML=h;
  attachGoalClicks();
}
function attachGoalClicks(){
  document.querySelectorAll(".goal-card[data-code]").forEach(el=>{
    el.onclick=()=>{
      const llKey=el.dataset.ll,f=el.dataset.fase==="U"?"U":+el.dataset.fase,code=el.dataset.code;
      const d=(DATA[llKey].doelen[f]||[]).find(x=>x.code===code);
      if(d)set({ll:llKey,fase:f,doel:d,view:S.view==='voortgang'?'leerlijn':S.view,selectedLib:null,aiIdeas:null,error:null});
    };
  });
  applyGoalFilter();
}

function renderSelect(app){
  let h="";
  if(S.error)h+=`<div class="err-box">⚠️ ${S.error}</div>`;

  // Globale zoekbalk — zoekt door alle doelen, incl. programmanamen
  h+=`<div class="step-label">Zoek een doel</div>
  <input id="globalSearch" class="goal-search global-search" type="text"
         placeholder="🔍 Zoek op kernwoord of programma (bv. Word, Scratch, wachtwoord, algoritme...)"
         value="${esc(S.gq)}" oninput="globalSearch(this.value)">
  <div class="global-hint">Tip: ook programmanamen werken — typ bv. <strong>Word</strong>, <strong>Teams</strong> of <strong>Bee-Bot</strong> en je ziet de bijhorende leerplandoelen.</div>
  <div id="globalResults"></div>`;

  h+=`<div id="viewArea">`;
  // Weergavekeuze
  h+=`<div class="step-label">Weergave</div><div class="view-row">`;
  [["leerlijn","📚 Per leerlijn"],["fase","🎯 Per fase"],["jaar","🎓 Per leerjaar"],["voortgang","📊 Mijn voortgang"]].forEach(([v,label])=>{
    h+=`<div class="view-btn${S.view===v?" active":""}" onclick="set({view:'${v}',ll:null,fase:null,jaar:null,doel:null,q:'',selectedLib:null,aiIdeas:null,error:null})">${label}</div>`;
  });
  h+=`</div>`;

  if(S.view==="leerlijn"){
    h+=`<div class="step-label">Stap 1</div><div class="section-title">Kies een leerlijn</div><div class="ll-grid">`;
    Object.entries(DATA).forEach(([key,l])=>{
      const sel=S.ll===key;
      h+=`<div class="ll-card${sel?" sel-"+key:""}" onclick="set({ll:'${key}',fase:null,doel:null,selectedLib:null,aiIdeas:null,error:null})">
        <div class="ll-icon">${l.icon}</div>
        <div class="ll-name">${l.label}</div>
      </div>`;
    });
    h+=`</div>`;
    if(S.ll){
      h+=`<div class="step-label">Stap 2</div><div class="section-title">Kies een fase</div><div class="phase-row">`;
      FASEN.forEach(f=>{
        const fi=FASE_INFO[f];
        if(!DATA[S.ll].doelen[f]?.length)return;
        h+=`<div class="phase-btn${S.fase===f?" active":""}" onclick="set({fase:${faseArg(f)},doel:null,selectedLib:null,aiIdeas:null,error:null})">
          <div>${faseNaam(f)}</div><div class="phase-age">${fi.age} · ${fi.label}</div>
        </div>`;
      });
      h+=`</div>`;
    }
    if(S.ll&&S.fase){
      h+=`<div class="step-label">Stap 3</div><div class="section-title">Kies een leerplandoel</div>`;
      h+=searchBoxHtml();
      h+=`<div class="goals-list">`;
      DATA[S.ll].doelen[S.fase].forEach(d=>{h+=goalCardHtml(S.ll,S.fase,d,false);});
      h+=`</div>`;
    }
  }

  if(S.view==="fase"){
    h+=`<div class="step-label">Stap 1</div><div class="section-title">Kies een fase</div><div class="phase-row">`;
    FASEN.forEach(f=>{
      const fi=FASE_INFO[f];
      h+=`<div class="phase-btn${S.fase===f?" active":""}" onclick="set({fase:${faseArg(f)},doel:null,q:'',selectedLib:null,aiIdeas:null,error:null})">
        <div>${faseNaam(f)}</div><div class="phase-age">${fi.age} · ${fi.label}</div>
      </div>`;
    });
    h+=`</div>`;
    if(S.fase){
      h+=`<div class="step-label">Stap 2</div><div class="section-title">Alle doelen van ${S.fase==="U"?"de uitbreidingsfase":"fase "+S.fase} — per leerlijn</div>`;
      h+=searchBoxHtml();
      h+=groupedGoalsHtml([S.fase],false);
    }
  }

  if(S.view==="jaar"){
    h+=`<div class="step-label">Stap 1</div><div class="section-title">Kies een leerjaar</div><div class="jaar-row">`;
    JAREN.forEach(j=>{
      h+=`<div class="jaar-btn${S.jaar===j.key?" active":""}" onclick="set({jaar:'${j.key}',doel:null,q:'',selectedLib:null,aiIdeas:null,error:null})">${j.label}</div>`;
    });
    h+=`</div>`;
    if(S.jaar){
      const j=JAREN.find(x=>x.key===S.jaar);
      const ageTxt=j.ages.map(ageLabel).join(" en ")+" jaar";
      h+=`<div class="step-label">Stap 2</div><div class="section-title">Doelen voor het ${j.label}</div>`;
      h+=`<div class="info-box">Getoond: doelen met startleeftijd ${ageTxt} (kinderen verjaren doorheen het schooljaar, vandaar de overlap). Doelen uit eerdere leerjaren blijven doorlopen — gebruik de fase-weergave voor het volledige overzicht.</div>`;
      h+=searchBoxHtml();
      h+=groupedGoalsByAges(j.ages);
    }
  }

  if(S.view==="voortgang"){
    const progCodes=Object.keys(PROG);
    const total=ALL_DOELEN.length;
    const cnt={bezig:0,behandeld:0,'geëvalueerd':0};
    progCodes.forEach(c=>{const s=PROG[c]?.status;if(s)cnt[s]=(cnt[s]||0)+1;});
    h+=`<div class="prog-summary">
      <span class="prog-stat"><span class="prog-stat-dot" style="background:#FDE047"></span>${cnt.bezig||0} bezig</span>
      <span class="prog-stat"><span class="prog-stat-dot" style="background:#4ADE80"></span>${cnt.behandeld||0} behandeld</span>
      <span class="prog-stat"><span class="prog-stat-dot" style="background:#60A5FA"></span>${cnt['geëvalueerd']||0} geëvalueerd</span>
      <span style="color:#5b6b7f;font-size:13.5px">van ${total} doelen (93 basis, 3 uitbreiding)</span>
      <button class="btn-ghost" style="padding:6px 14px;font-size:13.5px;margin-left:auto" onclick="exportProgress()">⬇ Exporteer</button>
      <button class="btn-ghost" style="padding:6px 14px;font-size:13.5px" onclick="importProgress()">⬆ Importeer</button>
      <button class="btn-ghost" style="padding:6px 14px;font-size:13.5px;color:#dc2626;border-color:#fca5a5" onclick="wisVoortgang()">🗑 Wis alles</button>
    </div>`;
    h+=herbekijkHtml();
    if(progCodes.length===0){
      h+=`<div class="prog-empty">Je hebt nog geen doelen gemarkeerd.<br><br>Klik op <strong>➕ status</strong> bij een doel in de andere weergaven<br>om bij te houden aan welke doelen je al gewerkt hebt.</div>`;
    }else{
      const statusDefs=[
        {s:'bezig',     label:'🟡 Bezig',       bg:'#FEF9C3',border:'#FDE047'},
        {s:'behandeld', label:'🟢 Behandeld',    bg:'#DCFCE7',border:'#4ADE80'},
        {s:'geëvalueerd',label:'🔵 Geëvalueerd',bg:'#DBEAFE',border:'#60A5FA'}
      ];
      statusDefs.forEach(({s,label,bg,border})=>{
        const items=ALL_DOELEN.filter(({d})=>PROG[d.code]?.status===s);
        if(!items.length)return;
        h+=`<div class="ll-group">
          <div class="ll-group-header" style="background:${bg};color:#1E293B;border-left:4px solid ${border}">${label} — ${items.length} doel${items.length!==1?'en':''}</div>
          <div class="goals-list">${items.map(({ll,f,d})=>goalCardHtml(ll,f,d,true)).join('')}</div>
        </div>`;
      });
    }
  }

  h+=`</div><!-- /viewArea -->`;

  if(S.doel){
    h+=`<button class="btn-primary" onclick="set({screen:'ideas',error:null})">Bekijk lessuggesties →</button>`;
  }

  // API-sleutel beheren
  const hasKey=!!localStorage.getItem(API_KEY_STORE);
  h+=`<div style="margin-top:30px;padding-top:16px;border-top:1px solid #E2E8F0;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <button class="btn-ghost" onclick="setApiKey()">🔑 AI-sleutel ${hasKey?"wijzigen":"instellen"}</button>
    <span style="font-size:13px;color:#5b6b7f;line-height:1.5">${hasKey?"✅ Sleutel ingesteld in deze browser.":"Optioneel: voor AI-gegenereerde lessuggesties en lesfiches."} De bibliotheek-ideeën bekijken kan altijd, ook zonder sleutel. <strong style="color:#b45309">Let op:</strong> dit is een persoonlijke sleutel buiten het schoolaccount — gebruik nooit leerlingnamen of vertrouwelijke schoolinfo in de prompts.</span>
  </div>`;

  app.innerHTML=h;
  renderGlobalResults();
  attachGoalClicks();
}

function renderIdeas(app){
  const d=S.doel;
  const ll=DATA[S.ll];
  const allIdeas=ideeenVoor(d);
  let h=`<div class="crumb no-print">
    <span class="crumb-link" onclick="set({screen:'select',aiIdeas:null,selectedLib:null,error:null})">← Leerlijn & doel</span>
    <span class="crumb-sep">›</span><span>${ll.icon} ${ll.label}</span>
    <span class="crumb-sep">›</span><span>${faseNaam(S.fase)}</span>
    <span class="crumb-sep">›</span><span style="font-weight:700">${d.code}</span>
  </div>`;
  h+=`<div class="section-title">${d.text}</div>`;
  h+=`<div class="info-box">Selecteer een lessuggestie of laat AI extra suggesties genereren. Klik daarna op "Maak lesfiche" voor de volledige uitwerking.</div>`;
  if(S.error)h+=`<div class="err-box">⚠️ ${S.error}</div>`;
  if(allIdeas.length){
    if(!d.ll23&&(d.les||[]).some(k=>k.startsWith("LL23")))h+=`<div class="info-box">🔗 Deze suggesties komen (deels) uit een verwant doel van leerplan 2023. Ga na of ze bij de nieuwe formulering passen.</div>`;
    h+=`<div class="step-label" style="margin-bottom:8px">Lessuggesties bij dit doel</div><div class="lib-ideas">`;
    allIdeas.forEach(idea=>{
      const sel=S.selectedLib===idea;
      h+=`<div class="lib-idea${sel?" selected":""}" onclick="selectLib('${idea.replace(/'/g,"\\'")}')">${sel?'✔ ':''}<strong>${idea}</strong></div>`;
    });
    h+=`</div>`;
  }else{
    h+=`<div class="info-box">✨ Voor dit doel zijn er <strong>nog geen lessuggesties</strong>. Gebruik de knop "Andere suggestie (AI)" hieronder om lesideeën te genereren.</div>`;
  }
  if(S.aiIdeas){
    h+=`<div class="step-label" style="margin:14px 0 8px">Extra AI-suggesties</div><div class="ai-grid">`;
    S.aiIdeas.forEach((idea,i)=>{
      h+=`<div class="ai-card" onclick="generateFiche('${(idea.title+" – "+idea.desc).replace(/'/g,"\\'")}')">
        <div class="ai-num">AI-idee ${i+1}</div>
        <div class="ai-title">${idea.title}</div>
        <div class="ai-desc">${idea.desc}</div>
        <div class="ai-arrow">→ Maak lesfiche</div>
      </div>`;
    });
    h+=`</div>`;
  }
  h+=`<div class="btn-row">`;
  if(S.selectedLib)h+=`<button class="btn-primary" onclick="generateFiche('${S.selectedLib.replace(/'/g,"\\'")}')">Maak lesfiche →</button>`;
  h+=`<button class="btn-ghost" onclick="generateAiIdeas()">✨ Andere suggestie (AI)</button>`;
  h+=`<button class="btn-ghost" onclick="set({screen:'select',aiIdeas:null,selectedLib:null,error:null})">← Terug</button>`;
  h+=`</div>`;
  app.innerHTML=h;
}

function selectLib(idea){set({selectedLib:idea,aiIdeas:null})}

function renderFiche(app){
  const f=S.fiche;
  const d=S.doel;
  const ll=DATA[S.ll];
  const fi=FASE_INFO[S.fase];
  const tabs=[{k:"overzicht",l:"📋 Overzicht"},{k:"lesplan",l:"📖 Lesplan"},{k:"materialen",l:"🎒 Materialen"},{k:"tips",l:"💡 Tips"}];

  let h=`<div class="crumb no-print">
    <span class="crumb-link" onclick="set({screen:'select',fiche:null,aiIdeas:null,selectedLib:null})">← Leerlijn & doel</span>
    <span class="crumb-sep">›</span>
    <span class="crumb-link" onclick="set({screen:'ideas',fiche:null})">Lessuggesties</span>
    <span class="crumb-sep">›</span><span style="font-weight:700">Lesfiche</span>
  </div>`;

  // Header
  const ageBg=ll.color+"22";
  h+=`<div class="fiche-header">
    <div class="fiche-age-badge" style="background:${ageBg};color:${ll.color}">${ll.icon} ${ll.label} · ${faseNaam(S.fase)} · ${fi.age} · ${fi.label}</div>
    <div class="fiche-title-main">${f.titel||""}</div>
    <div class="fiche-subtitle">${d.code} – ${d.text}</div>
    <div class="fiche-meta">
      <span>⏱ ${f.duur||"50 min"}</span>
      <span>👥 ${f.groep||"Klassikaal"}</span>
      <span>🎂 ${fi.age}</span>
    </div>
  </div>`;

  // Tabs
  h+=`<div class="tabs no-print">`;
  tabs.forEach(t=>{ h+=`<button class="tab-btn${S.tab===t.k?" active":""}" onclick="set({tab:'${t.k}'})">${t.l}</button>`; });
  h+=`</div>`;

  // Content
  if(S.tab==="overzicht"||true){
    const vis=S.tab==="overzicht";
    h+=`<div style="${vis?"":"display:none"}">`;
    h+=`<div class="card"><div class="card-title">📝 Beschrijving</div><p style="font-size:15px;color:#475569;line-height:1.7">${f.beschrijving||""}</p></div>`;
    h+=`<div class="card"><div class="card-title">🎯 Hoofdlesdoel</div><div class="goal-banner">${f.hoofddoel||""}</div>`;
    (f.subdoelen||[]).forEach(s=>{ h+=`<div class="subdoel"><div class="dot"></div><span>${s}</span></div>`; });
    h+=`</div>`;
    if(f.digcompedu?.length){h+=`<div class="card"><div class="card-title">🏫 DigCompEdu-competenties</div><div>`;f.digcompedu.forEach(c=>{h+=`<span class="tag">${c}</span>`;});h+=`</div></div>`;}
    h+=`<div class="card"><div class="card-title">⚖️ Differentiatie</div><div class="diff-grid">
      <div class="diff-easy"><div class="diff-label">🟠 Vereenvoudigd</div><div class="diff-text">${f.diff?.easy||""}</div></div>
      <div class="diff-hard"><div class="diff-label">🟣 Uitdagend</div><div class="diff-text">${f.diff?.hard||""}</div></div>
    </div></div>`;
    h+=`</div>`;
  }
  if(S.tab==="lesplan"||true){
    const vis=S.tab==="lesplan";
    h+=`<div style="${vis?"":"display:none"}">`;
    h+=`<div class="opwarmer"><div class="opwarmer-label">🔥 Opwarmer / Startopdracht</div><div class="opwarmer-text">${f.lesplan?.opwarmer||""}</div></div>`;
    (f.lesplan?.stappen||[]).forEach((stap,i,arr)=>{
      h+=`<div class="step-row">
        <div class="step-line"><div class="step-num">${i+1}</div>${i<arr.length-1?'<div class="step-connector"></div>':''}</div>
        <div class="step-body">
          <div class="step-title-row"><span class="step-title">${stap.titel}</span><span class="step-time">⏱ ${stap.tijd}</span></div>
          <div class="step-desc">${stap.omschrijving}</div>
          <div class="dialoog-box"><div class="dialoog-label">💬 Wat de leerkracht zegt/vraagt</div><div class="dialoog-text">${stap.dialoog}</div></div>
        </div>
      </div>`;
    });
    h+=`<div class="afsluiting"><div class="afsluiting-label">✅ Afsluiting</div><div class="afsluiting-text">${f.lesplan?.afsluiting||""}</div></div>`;
    h+=`<div class="toetsing"><div style="font-weight:800;color:#047857;margin-bottom:6px;font-size:13.5px;">🔍 Toetsing / Hoe check je begrip?</div><div style="font-size:14.5px;color:#1E293B;line-height:1.6">${f.lesplan?.toetsing||""}</div></div>`;
    h+=`</div>`;
  }
  if(S.tab==="materialen"||true){
    const vis=S.tab==="materialen";
    h+=`<div style="${vis?"":"display:none"}">`;
    h+=`<div class="card"><div class="card-title">📦 Benodigde materialen</div>`;
    (f.materialen?.lijst||[]).forEach(m=>{ h+=`<div class="mat-item"><span class="mat-dot">•</span><span>${m}</span></div>`; });
    h+=`</div>`;
    (f.materialen?.uitleg||[]).forEach(u=>{ h+=`<div class="mat-uitleg"><div class="mat-uitleg-title">${u.titel}</div><div class="mat-uitleg-text">${u.tekst}</div></div>`; });
    h+=`</div>`;
  }
  if(S.tab==="tips"||true){
    const vis=S.tab==="tips";
    h+=`<div style="${vis?"":"display:none"}">`;
    h+=`<div class="card"><div class="card-title">💡 Tips voor de leerkracht</div>`;
    (f.tips||[]).forEach(t=>{ h+=`<div class="tip-item"><div class="tip-title">${t.titel}</div><div class="tip-text">${t.tekst}</div></div>`; });
    h+=`</div>`;
    if(f.begrippen?.length){
      h+=`<div class="card"><div class="card-title">📖 Begrippen</div>`;
      f.begrippen.forEach(b=>{ h+=`<div class="begrip-item"><div class="begrip-term">${b.term}</div><div class="begrip-def">${b.def}</div></div>`; });
      h+=`</div>`;
    }
    h+=`</div>`;
  }

  h+=`<div class="btn-row no-print">
    <button class="btn-ghost" onclick="set({screen:'ideas',fiche:null})">← Andere lessuggestie</button>
    <button class="btn-ghost" onclick="set({screen:'select',fiche:null,aiIdeas:null,selectedLib:null})">↩ Opnieuw beginnen</button>
    <button class="btn-primary" onclick="window.print()">🖨️ Print lesfiche</button>
  </div>`;

  app.innerHTML=h;

  // Tab switching after render
  tabs.forEach(t=>{
    const btn=app.querySelector(`.tab-btn[onclick*="${t.k}"]`);
    if(btn)btn.onclick=()=>set({tab:t.k});
  });
}

render();
</script>
</body>
</html>
